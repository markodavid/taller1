[project]
name = "taller1"
version = "0.1.0"
description = "Laboratorio de clasificación de variedades de frijol seco (Dry Bean) con CRISP-DM, TDSP y Scrum ML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marko David García", email = "markodavidgm@gmail.com" },
    { name = "Alejandro Meneses" },
    { name = "Henry Rosenstiehl" },
]
requires-python = ">=3.13"
keywords = ["machine-learning", "crisp-dm", "tdsp", "scrum-ml", "dry-bean", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
taller1 = "taller1.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["taller1"]

[tool.ruff.lint.per-file-ignores]
# En notebooks los imports van después de anclar sys.path, no al inicio del archivo.
"*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
